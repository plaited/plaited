description = "Author and install an AgentSkills-compliant typescript-lsp skill (SKILL.md + JSON-in/JSON-out CLI over the TypeScript 7 native API) at a conventional discovery location, verified against a baked-in fixture file"
keywords = ["agent-skills", "cli", "typescript", "lsp", "json"]

[[task.authors]]
name = "Behavioral"
email = "agents@behavioral.sh"

[metadata]
difficulty = "hard"
category = "programming"
tags = ["agent-skills", "cli", "typescript", "lsp", "json"]

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 3600.0

[environment]
network_mode = "no-network"
build_timeout_sec = 900.0
os = "linux"
workdir = "/app"
